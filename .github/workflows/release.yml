name: Release

# Signed builds and store uploads. It only ever runs when the maintainer starts
# it: never on a push, a merge to main or a pull request, so nothing reaches a
# store by accident and forks can't reach the secrets. Jobs that use secrets
# wait for approval in their protected environments. See apple/docs/RELEASING.md.
#
# One `release` with platform `all` ships everything with one set of notes:
#   apple    iPhone, iPad and Mac to App Store Connect (fastlane, apple/)
#   art      refreshes every platform's screenshots and store art on a
#            release-docs/vX.Y.Z branch to merge with a PR (dispatches
#            windows-screenshots.yml and store-assets.yml, which uploads the
#            new Apple store art) and waits for both, so nothing is submitted
#            to a store before its art is up
#   windows  the Microsoft Store, from that branch with its new screenshots
#            (dispatches windows-store.yml)
#   tag      vX.Y.Z and the GitHub release

on:
  workflow_dispatch:
    inputs:
      lane:
        description: What to run
        type: choice
        default: beta
        options:
          - beta            # Apple build + upload to TestFlight
          - release         # every store (no App Store submit), docs refresh, tag + GitHub release
          - metadata_only   # Apple metadata + screenshots, no build
          - pull_metadata   # download the live Apple store copy (artifact)
          - signing_setup   # create Apple certificates/profiles in the match repo
      platform:
        description: Platform (all = iPhone, iPad, Mac and Windows)
        type: choice
        default: all
        options: [all, apple, ios, mac, windows]
      notes:
        description: What's New text for every store (blank = built from the PRs merged since the last release)
        type: string
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apple

jobs:
  notes:
    name: Release notes
    if: >-
      github.repository == 'yennster/fanficly' && github.actor == 'yennster' &&
      (inputs.lane == 'beta' || inputs.lane == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read    # the PRs merged since the last release
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.collect.outputs.notes }}
      windows_notes: ${{ steps.collect.outputs.windows_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tags, to find the previous release

      - name: Check the version is new
        id: version
        env:
          LANE: ${{ inputs.lane }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          version=$(sed -nE 's/^ *MARKETING_VERSION: "([^"]+)"/\1/p' project.yml)
          # A Windows-only release ships no Apple version, so it needs no new tag.
          if [ "$LANE" = release ] && [ "$PLATFORM" != windows ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Bump MARKETING_VERSION in apple/project.yml first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Collect what changed since the last release
        id: collect
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          bin/release-notes.py
          delim="NOTES_$(openssl rand -hex 8)"
          {
            echo "notes<<$delim"; cat build/release/notes.txt; echo "$delim"
            echo "windows_notes<<$delim"; cat build/release/notes-windows.txt; echo "$delim"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## What's New (App Store)"; echo; cat build/release/notes.txt; echo
            echo "## What's New (Microsoft Store)"; echo; cat build/release/notes-windows.txt; echo
            cat build/release/changes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: apple/build/release

  apple:
    name: Apple ${{ inputs.lane }} (${{ inputs.platform }})
    needs: notes
    if: >-
      !cancelled() && github.repository == 'yennster/fanficly' && github.actor == 'yennster' &&
      inputs.platform != 'windows' && needs.notes.result != 'failure'
    runs-on: macos-26
    timeout-minutes: 120
    environment: app-store
    permissions:
      contents: read
    outputs:
      build: ${{ steps.build.outputs.build }}
    # Secrets are given only to the steps that need them (the fastlane step and
    # the deploy-key step), not to the tool installs.
    env:
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: needs.notes.result == 'success'
        with:
          name: release-notes
          path: apple/build/release

      - name: Use the release notes
        if: needs.notes.result == 'success'
        run: echo "RELEASE_NOTES_FILE=$PWD/build/release/notes.txt" >> "$GITHUB_ENV"

      - name: Select newest installed Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: apple

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # match clones the private certificates repo over SSH with a deploy key.
      - name: Give match its deploy key
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
          chmod 600 ~/.ssh/match_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/match_deploy_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: fastlane ${{ inputs.lane }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          REVIEW_FIRST_NAME: ${{ secrets.REVIEW_FIRST_NAME }}
          REVIEW_LAST_NAME: ${{ secrets.REVIEW_LAST_NAME }}
          REVIEW_EMAIL: ${{ secrets.REVIEW_EMAIL }}
          REVIEW_PHONE: ${{ secrets.REVIEW_PHONE }}
          REVIEW_DEMO_USER: ${{ secrets.REVIEW_DEMO_USER }}
          REVIEW_DEMO_PASSWORD: ${{ secrets.REVIEW_DEMO_PASSWORD }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in ios|mac) p="$PLATFORM" ;; *) p=both ;; esac
          bundle exec fastlane ios "${{ inputs.lane }}" platform:"$p"

      - name: Report the build number
        id: build
        if: always()
        run: echo "build=$(cat build/release/build-number.txt 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Upload the downloaded store copy
        if: inputs.lane == 'pull_metadata'
        uses: actions/upload-artifact@v4
        with:
          name: metadata
          path: |
            apple/fastlane/metadata
            apple/fastlane/metadata-mac

      - name: Remove the keys
        if: always()
        run: rm -f ~/.ssh/match_deploy_key fastlane/api_key.json fastlane/AuthKey_*.p8

  art:
    name: Refresh screenshots and store art
    needs: [notes, apple]
    if: >-
      !cancelled() && inputs.lane == 'release' && inputs.platform == 'all' &&
      needs.notes.result == 'success' && needs.apple.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write   # the release-docs/ branch
      actions: write    # to start and watch the screenshot workflows
    outputs:
      branch: ${{ steps.start.outputs.branch }}
    steps:
      # Before any store submission: the App Store version and the Microsoft
      # Store submission lock their screenshots once submitted, so the new
      # ones have to be up first.
      - name: Start the screenshot runs on a release-docs branch
        id: start
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.notes.outputs.version }}
        run: |
          branch="release-docs/v$VERSION"
          if gh api "repos/$GH_REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            # A re-run of the same version: the Windows package is built from
            # this branch, so it must hold this release's code. Keep it only
            # when it's already built on this commit.
            status=$(gh api "repos/$GH_REPO/compare/$GITHUB_SHA...$branch" --jq .status)
            if [ "$status" = ahead ] || [ "$status" = identical ]; then
              echo "$branch already exists on this commit; adding to it"
            else
              echo "$branch is from an older commit; moving it to $GITHUB_SHA"
              gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$branch" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            fi
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          # gh workflow run doesn't say which run it started: note the runs
          # that already exist, and take the first new one after starting.
          existing() {
            gh run list --workflow "$1" --event workflow_dispatch --limit 20 --json databaseId --jq '[.[].databaseId]' || echo '[]'
          }
          before_win=$(existing windows-screenshots.yml)
          before_art=$(existing store-assets.yml)
          # Windows screenshots commit to the branch they run on.
          gh workflow run windows-screenshots.yml --ref "$branch"
          # Apple: regenerate on main, upload to the App Store versions this
          # release just made (approval in app-store), and push to the branch.
          gh workflow run store-assets.yml --ref main -f what=store_art -f upload=true \
            -f push_branch=true -f branch="$branch" -f sha="$GITHUB_SHA"
          for wf in windows-screenshots.yml store-assets.yml; do
            if [ "$wf" = store-assets.yml ]; then before=$before_art; else before=$before_win; fi
            id=""
            for _ in $(seq 30); do
              id=$(gh run list --workflow "$wf" --event workflow_dispatch --limit 20 \
                --json databaseId --jq "[.[].databaseId | select(IN($before[]) | not)] | min // empty" || true)
              [ -n "$id" ] && break
              sleep 10
            done
            [ -n "$id" ] || { echo "::error::Couldn't find the $wf run that was just started"; exit 1; }
            echo "${wf%.yml}=$id" >> "$GITHUB_OUTPUT"
          done
          {
            echo "### Screenshots and store art"
            echo
            echo "Regenerating every platform's screenshots onto \`$branch\`. Approve **app-store** on the Store assets run when it asks, to upload the new App Store art."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the Windows screenshots
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Poll rather than gh run watch: one API error mid-wait would stop
          # watch and skip the Windows release while the run is fine.
          wait_for() {
            local id=$1 state="" errors=0
            while :; do
              if state=$(gh run view "$id" --json status,conclusion --jq '.status + " " + .conclusion'); then
                errors=0
                case "$state" in completed*) break ;; esac
              elif [ $((errors += 1)) -ge 10 ]; then
                echo "::error::Couldn't read run $id"; return 1
              fi
              sleep 60
            done
            [ "$state" = "completed success" ] || { echo "::error::Run $id ended: ${state#completed }"; return 1; }
          }
          wait_for "${{ steps.start.outputs.windows-screenshots }}"

      - name: Wait for the App Store art upload
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Poll rather than gh run watch: one API error mid-wait would stop
          # watch and skip the Windows release while the run is fine.
          wait_for() {
            local id=$1 state="" errors=0
            while :; do
              if state=$(gh run view "$id" --json status,conclusion --jq '.status + " " + .conclusion'); then
                errors=0
                case "$state" in completed*) break ;; esac
              elif [ $((errors += 1)) -ge 10 ]; then
                echo "::error::Couldn't read run $id"; return 1
              fi
              sleep 60
            done
            [ "$state" = "completed success" ] || { echo "::error::Run $id ended: ${state#completed }"; return 1; }
          }
          wait_for "${{ steps.start.outputs.store-assets }}"
          {
            echo
            echo "The new App Store screenshots and art are uploaded: **Submit for Review** in App Store Connect now."
            echo "Open a PR from \`${{ steps.start.outputs.branch }}\` to put the pictures on main."
          } >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Windows (Microsoft Store)
    needs: [notes, apple, art]
    if: >-
      !cancelled() && inputs.lane == 'release' &&
      (inputs.platform == 'all' || inputs.platform == 'windows') &&
      needs.notes.result == 'success' && needs.apple.result != 'failure' &&
      needs.art.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      actions: write   # to start windows-store.yml (it waits for approval in microsoft-store)
    steps:
      - name: Start the Microsoft Store release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The Windows What's New from bin/release-notes.py: the written notes
          # when given, else the Windows changes merged since the last release.
          # Empty (no Windows changes) keeps windows/store/listing/en-us/release_notes.txt.
          NOTES: ${{ needs.notes.outputs.windows_notes }}
          # With a full release, the release-docs branch: main's code plus the
          # screenshots just taken, which go up in the same submission.
          BRANCH: ${{ needs.art.outputs.branch }}
        run: |
          args=(-f submit=true)
          ref=main
          if [ -n "$BRANCH" ]; then
            ref="$BRANCH"
            args+=(-f upload_screenshots=true)
          fi
          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            args+=(-f release_notes="$NOTES")
          fi
          gh workflow run windows-store.yml --ref "$ref" "${args[@]}"
          echo "Started the Windows Store release from \`$ref\`: approve **microsoft-store** under Actions > Windows Store release." >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag and GitHub release
    needs: [notes, apple]
    if: >-
      !cancelled() && inputs.lane == 'release' &&
      needs.notes.result == 'success' && needs.apple.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # tags vX.Y.Z and publishes the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: Tag and publish the GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.notes.outputs.version }}
          BUILD: ${{ needs.apple.outputs.build }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in
            ios) where="iOS" ;; mac) where="Mac" ;; apple) where="iOS + Mac" ;;
            *) where="iOS + Mac; Windows went to the Microsoft Store separately" ;;
          esac
          {
            echo "## What's new in $VERSION"
            echo
            echo "### iPhone, iPad and Mac"
            echo
            cat notes/notes.txt
            echo
            # The tag marks where every app's next notes start, so only list
            # Windows when this run shipped it too.
            if [ "$PLATFORM" = all ] && [ -n "$(tr -d '[:space:]' < notes/notes-windows.txt)" ]; then
              echo "### Windows"
              echo
              cat notes/notes-windows.txt
              echo
            fi
            cat notes/changes.md
            echo "App Store: version $VERSION, build $BUILD ($where). Submit for Review in App Store Connect once the store art is uploaded."
          } > github-release.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            --title "Fanficly v$VERSION" --notes-file github-release.md
