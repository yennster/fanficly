name: Restore the creative art

# Brings back the product-page header and search-results art the live iOS
# version shows: downloads both images from App Store Connect, pushes them to
# a creative-originals/ branch (apple/screenshots/creative/) so they're kept in
# git, and with "apply" puts those same assets on the editable iOS version in
# place of the newer art. Nothing is re-uploaded and nothing submits. Started
# by hand only (apple/bin/restore-creative-assets.py).

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Put them on the editable iOS version (unchecked = only download and push them)
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apple

jobs:
  restore:
    name: Restore the live header and search art
    if: github.repository == 'yennster/fanficly' && github.actor == 'yennster'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: app-store
    permissions:
      contents: write   # only for the creative-originals/ branch push
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the API client's Python packages
        run: |
          python -m venv bin/.venv
          bin/.venv/bin/pip install --require-hashes -r bin/requirements.txt

      - name: Restore the art
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLY: ${{ inputs.apply }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "fastlane/AuthKey_${ASC_KEY_ID}.p8"
          jq -n --arg k "$ASC_KEY_ID" --arg i "$ASC_ISSUER_ID" --arg p "$ASC_KEY_P8" \
            '{key_id: $k, issuer_id: $i, key: $p, in_house: false}' > fastlane/api_key.json
          if [ "$APPLY" = "true" ]; then
            bin/.venv/bin/python bin/restore-creative-assets.py --apply
          else
            bin/.venv/bin/python bin/restore-creative-assets.py
          fi

      - name: Remove the keys
        if: always()
        run: rm -f fastlane/api_key.json fastlane/AuthKey_*.p8

      - name: Upload the art
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-originals
          path: apple/fastlane/creative/en-US
          if-no-files-found: ignore

      - name: Push them to a creative-originals/ branch
        run: |
          mkdir -p screenshots/creative
          cp fastlane/creative/en-US/*.png screenshots/creative/
          git add screenshots/creative
          if git diff --cached --quiet; then echo "Already in git"; exit 0; fi
          branch="creative-originals/run-${{ github.run_number }}"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Keep the live App Store header and search-results art (run ${{ github.run_number }})"
          git push origin "HEAD:refs/heads/$branch"
          echo "Pushed $branch: open a PR from it to keep the art in git." >> "$GITHUB_STEP_SUMMARY"
