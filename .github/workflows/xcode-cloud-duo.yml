name: Xcode Cloud Duo tests

# GitHub's ci.yml runs ReaderLayoutTests on the iPhone Duo for pull requests
# that change the reader's layout, on its "xcode-27" runner. This is the
# fallback in Xcode Cloud, started by hand only, since Xcode Cloud's 100
# compute hours a month are kept for releases: its "Duo tests" workflow
# (bin/xcode-cloud-duo.py) never starts on its own. Given a branch, this brings
# that workflow up to date (the newest Xcode with a Duo), runs it on the
# branch, waits, and exports the result bundle's attachments,
# ReaderLayoutTests' screenshots among them, as the duo-tests artifact.
# Without a branch it only brings the Xcode Cloud workflow up to date. The Duo
# boots in one pose (pose can't be scripted), so this covers that pose only.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to test (empty = only update the Xcode Cloud workflow)
        required: false

permissions:
  contents: read

concurrency:
  group: xcode-cloud-duo
  cancel-in-progress: false

defaults:
  run:
    working-directory: apple

jobs:
  screenshots:
    name: Duo screenshots
    if: github.repository == 'yennster/fanficly' && github.actor == 'yennster'
    # macOS for xcresulttool; the waiting is on Xcode Cloud.
    runs-on: macos-26
    timeout-minutes: 180
    environment: app-store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install the API client's Python packages
        run: |
          python -m venv bin/.venv
          bin/.venv/bin/pip install --require-hashes -r bin/requirements.txt

      - name: Xcode Cloud
        id: xcode-cloud
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BRANCH: ${{ inputs.branch }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "fastlane/AuthKey_${ASC_KEY_ID}.p8"
          jq -n --arg k "$ASC_KEY_ID" --arg i "$ASC_ISSUER_ID" --arg p "$ASC_KEY_P8" \
            '{key_id: $k, issuer_id: $i, key: $p, in_house: false}' > fastlane/api_key.json
          if [ -n "$BRANCH" ]; then
            bin/.venv/bin/python bin/xcode-cloud-duo.py run "$BRANCH" build/xcode-cloud
          else
            bin/.venv/bin/python bin/xcode-cloud-duo.py setup
          fi

      - name: Remove the keys
        if: always()
        run: rm -f fastlane/api_key.json fastlane/AuthKey_*.p8

      # The bundles come from a newer Xcode than this runner's, whose
      # xcresulttool may not read them: then this step fails and the raw
      # zips are still in the artifact.
      - name: Export the attachments
        id: export
        if: always()
        run: |
          mkdir -p build/duo-attachments
          [ -d build/xcode-cloud ] || exit 0
          cd build/xcode-cloud
          # One bad download (Xcode Cloud's crash log bundle can come back as
          # something that isn't a zip) mustn't lose the other bundles.
          for z in *.zip; do
            [ -f "$z" ] || continue
            ditto -x -k "$z" . || echo "::warning::Couldn't unpack $z"
          done
          n=0
          while read -r b; do
            n=$((n + 1))
            xcrun xcresulttool export attachments --path "$b" --output-path "../duo-attachments/$n-$(basename "$b" .xcresult)"
          done < <(find . -maxdepth 4 -name "*.xcresult")
          ls -laR ../duo-attachments

      - uses: actions/upload-artifact@v7
        id: upload
        if: always()
        with:
          name: duo-tests
          path: |
            apple/build/duo-attachments
            apple/build/xcode-cloud/*.zip
          if-no-files-found: ignore
