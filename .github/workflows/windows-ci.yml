name: Windows CI

# The Windows app (windows/): core unit tests, the WinUI app for x64 and
# ARM64, a demo-mode launch with a screenshot, UI tests that drive the app
# and photograph every screen, and the Store MSIX bundle.
on:
  push:
    branches: [windows]
    paths: ['windows/**', '.github/workflows/windows-*.yml']
  pull_request:
    branches: [windows]
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.ref }}
  # Let a running build finish (a newer push waits, and replaces any
  # older waiting run), so frequent pushes still get a full result.
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core-tests:
    name: Core tests
    runs-on: windows-latest
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: windows/global.json }
      - name: Unit tests
        run: dotnet test tests/Fanficly.Core.Tests -c Release --logger "trx;LogFileName=core.trx" --results-directory ../artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: core-test-results, path: artifacts/test-results }

  app:
    name: App (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    defaults: { run: { working-directory: windows } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: windows/global.json }
      - name: Build (unpackaged, self-contained, for the launch test)
        run: >
          dotnet build src/Fanficly.App -c Debug -p:Platform=${{ matrix.platform }}
          -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          -p:RuntimeIdentifier=win-${{ matrix.platform == 'x64' && 'x64' || 'arm64' }}
          -o ../artifacts/app-${{ matrix.platform }}
      - name: Launch in demo mode and capture the window
        if: matrix.platform == 'x64'
        shell: pwsh
        run: ./scripts/Capture-Screen.ps1 -Exe ../artifacts/app-x64/Fanficly.exe -Out ../artifacts/screenshots/launch.png -EmitBase64
      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'x64'
        with: { name: launch-screenshot, path: artifacts/screenshots, if-no-files-found: ignore }

  ui-tests:
    name: UI tests and screenshots
    runs-on: windows-latest
    defaults: { run: { working-directory: windows } }
    env:
      FANFICLY_EXE: ${{ github.workspace }}\artifacts\app-x64\Fanficly.exe
      FANFICLY_SCREENSHOTS: ${{ github.workspace }}\artifacts\ui-screenshots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: windows/global.json }
      - name: Build the app (unpackaged, x64)
        run: >
          dotnet build src/Fanficly.App -c Debug -p:Platform=x64
          -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true -p:RuntimeIdentifier=win-x64
          -o ../artifacts/app-x64
      - name: Build the UI tests
        run: dotnet build tests/Fanficly.UITests -c Debug
      - name: Enlarge the display
        timeout-minutes: 2
        continue-on-error: true
        shell: pwsh
        run: ./scripts/Set-ScreenResolution.ps1 -Width 1920 -Height 1200
      - name: Install the Windows 11 icon font
        timeout-minutes: 3
        continue-on-error: true
        shell: pwsh
        run: ./scripts/Install-IconFont.ps1
      - name: Smoke tests
        timeout-minutes: 20
        run: dotnet test tests/Fanficly.UITests --no-build --filter "FullyQualifiedName~SmokeTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=smoke.trx" --results-directory ../artifacts/test-results
      - name: Screenshots (desktop, tablet, compact)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: dotnet test tests/Fanficly.UITests --no-build --filter "FullyQualifiedName~ScreenshotTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=screens.trx" --results-directory ../artifacts/test-results
      - name: Reader layout tests
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: dotnet test tests/Fanficly.UITests --no-build --filter "FullyQualifiedName~ReaderLayoutTests" --logger "console;verbosity=normal" --logger "trx;LogFileName=reader-layout.trx" --results-directory ../artifacts/test-results
      - name: Chart the icon fonts
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          python -m pip install --quiet fonttools pillow
          python scripts/Chart-IconFont.py ../artifacts/icon-font-charts
          ./scripts/Write-Screenshots.ps1 -Dir ../artifacts/icon-font-charts -MaxWidth 1152 -Quality 80
      - name: Print the screenshots to the log
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/Write-Screenshots.ps1 -Dir ../artifacts/ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-screenshots, path: artifacts/ui-screenshots, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ui-test-results, path: artifacts/test-results, if-no-files-found: ignore }

  package:
    name: MSIX bundle (Store upload)
    runs-on: windows-latest
    needs: [core-tests, app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { global-json-file: windows/global.json }
      - uses: microsoft/setup-msbuild@v2
      - name: Restore
        working-directory: windows
        run: msbuild src/Fanficly.App/Fanficly.App.csproj /t:Restore /p:Configuration=Release
      - name: Build the x64 + ARM64 bundle (Native AOT)
        working-directory: windows
        run: >
          msbuild src/Fanficly.App/Fanficly.App.csproj /p:Configuration=Release /p:Platform=x64
          /p:AppxBundle=Always "/p:AppxBundlePlatforms=x64|arm64"
          /p:UapAppxPackageBuildMode=StoreUpload /p:AppxPackageDir=${{ github.workspace }}\artifacts\AppPackages\
          /p:GenerateAppxPackageOnBuild=true /p:AppxPackageSigningEnabled=false
      - uses: actions/upload-artifact@v4
        with: { name: msix-bundle, path: artifacts/AppPackages }
