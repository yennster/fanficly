name: CI

# The Apple app, in apple/. The Windows app (windows/) has its own workflows,
# windows-*.yml; each runs only for its own app's paths.
#
# Every Apple build uses the newest Xcode 27 or later, because an app built
# with an older SDK runs in compatibility mode on the iPhone Duo (1.11.0,
# built here with Xcode 26.6, did). GitHub's macOS runners don't have Xcode 27
# yet, so the unit and UI tests run in Xcode Cloud's "CI" workflow
# (apple/bin/xcode-cloud-ci.py) and the iPhone Duo's in "Duo tests"; Xcode
# Cloud reports both on the pull request as checks. This job only checks the
# release and Xcode Cloud tooling that runs from GitHub.
on:
  push:
    branches: [main]
    paths: ['apple/**', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['apple/**', '.github/workflows/ci.yml']

defaults:
  run:
    working-directory: apple

jobs:
  tooling:
    name: Release and Xcode Cloud tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Parse the scripts
        run: |
          python3 -m py_compile bin/xcode_cloud.py bin/xcode-cloud-ci.py bin/xcode-cloud-release.py \
            bin/xcode-cloud-duo.py bin/asc_assets.py bin/release-notes.py
          ruby -c fastlane/Fastfile
          sh -n ci_scripts/ci_post_clone.sh
