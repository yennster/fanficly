name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Discover available simulators
        id: sim
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          IPHONE_ID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; cands=[(k,dev) for k,v in d.items() if 'iOS' in k for dev in v if dev['name'].startswith('iPhone')]; cands.sort(key=lambda x: x[0], reverse=True); print(cands[0][1]['udid'])")
          IPAD_ID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; cands=[(k,dev) for k,v in d.items() if 'iOS' in k for dev in v if dev['name'].startswith('iPad')]; cands.sort(key=lambda x: x[0], reverse=True); print(cands[0][1]['udid'])")
          echo "Picked iPhone UDID: $IPHONE_ID"
          echo "Picked iPad UDID:   $IPAD_ID"
          echo "iphone_id=$IPHONE_ID" >> "$GITHUB_OUTPUT"
          echo "ipad_id=$IPAD_ID"     >> "$GITHUB_OUTPUT"

      - name: Build & test on iPhone
        run: |
          xcodebuild test \
            -project Fanficly.xcodeproj \
            -scheme Fanficly \
            -destination "id=${{ steps.sim.outputs.iphone_id }}" \
            -only-testing:FanficlyTests \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/iphone.xcresult

      - name: Build & test on iPad
        run: |
          xcodebuild test \
            -project Fanficly.xcodeproj \
            -scheme Fanficly \
            -destination "id=${{ steps.sim.outputs.ipad_id }}" \
            -only-testing:FanficlyTests \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath build/ipad.xcresult

      - name: Upload result bundles on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: build/*.xcresult
