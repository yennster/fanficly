name: Fanficly
options:
  bundleIdPrefix: io.github.yennster
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "10"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2,6"
    SUPPORTS_MACCATALYST: "YES"
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.2
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: 4.2.2

targets:
  Fanficly:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Your Apple Developer team ID lives in Signing.xcconfig (kept out of
    # git so it isn't committed to the public repo). See the README.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Fanficly
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Fanficly/Resources
        optional: true
    dependencies:
      - package: SwiftSoup
      - package: KeychainAccess
      - target: FanficlyShare
      - target: FanficlyWidget
    info:
      path: Fanficly/Info.plist
      properties:
        CFBundleDisplayName: Fanficly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: io.github.yennster.fanficly
            CFBundleURLSchemes:
              - fanficly
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.yennster.fanficly.subscriptionRefresh
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.books
        NSUserActivityTypes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yennster.fanficly
        PRODUCT_NAME: Fanficly
        CODE_SIGN_ENTITLEMENTS: Fanficly/Fanficly.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  FanficlyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: FanficlyTests
    dependencies:
      - target: Fanficly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yennster.fanficly.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  FanficlyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: FanficlyUITests
    dependencies:
      - target: Fanficly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yennster.fanficly.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  FanficlyShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: FanficlyShare
    info:
      path: FanficlyShare/Info.plist
      properties:
        CFBundleDisplayName: Fanficly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionPointIdentifier: com.apple.share-services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yennster.fanficly.share
        PRODUCT_NAME: FanficlyShare
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

  FanficlyWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: FanficlyWidget
      - path: Fanficly/WidgetProgressStore.swift
    info:
      path: FanficlyWidget/Info.plist
      properties:
        CFBundleDisplayName: Fanficly Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yennster.fanficly.widget
        PRODUCT_NAME: FanficlyWidget
        CODE_SIGN_ENTITLEMENTS: FanficlyWidget/FanficlyWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

schemes:
  Fanficly:
    build:
      targets:
        Fanficly: all
        FanficlyShare: all
        FanficlyWidget: all
        FanficlyTests: [test]
        FanficlyUITests: [test]
    test:
      targets:
        - FanficlyTests
        - FanficlyUITests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
