name: Fanficly
options:
  bundleIdPrefix: io.github.yennster
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.7.2
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: 4.2.2

targets:
  Fanficly:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Your Apple Developer team ID lives in Signing.xcconfig (kept out of
    # git so it isn't committed to the public repo). See the README.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    sources:
      - path: Fanficly
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Fanficly/Resources
        optional: true
    dependencies:
      - package: SwiftSoup
      - package: KeychainAccess
    info:
      path: Fanficly/Info.plist
      properties:
        CFBundleDisplayName: Fanficly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - io.github.yennster.fanficly.subscriptionRefresh
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.books
        NSUserActivityTypes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yennster.fanficly
        PRODUCT_NAME: Fanficly
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  FanficlyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FanficlyTests
    dependencies:
      - target: Fanficly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yennster.fanficly.tests
        GENERATE_INFOPLIST_FILE: YES

  FanficlyUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FanficlyUITests
    dependencies:
      - target: Fanficly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yennster.fanficly.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Fanficly:
    build:
      targets:
        Fanficly: all
        FanficlyTests: [test]
        FanficlyUITests: [test]
    test:
      targets:
        - FanficlyTests
        - FanficlyUITests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
