<!doctype html>
<!-- App Store creative assets (product-page header, search results), filled
     in and rendered by bin/make-creative-assets.py ($placeholders are
     string.Template fields). Headline and devices stay inside Apple's
     centered safe area ($safe_w x $safe_h); open with ?guides=1 to see it. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="$css">
<style>
  :root { --w: ${w}px; --h: ${h}px; --sw: ${safe_w}px; --sh: ${safe_h}px; }
  .safe {
    position: absolute; left: calc((var(--w) - var(--sw)) / 2); top: calc((var(--h) - var(--sh)) / 2);
    width: var(--sw); height: var(--sh);
  }
  .text {
    position: absolute; left: 0; right: 0; top: var(--text-top);
    display: flex; flex-direction: column; align-items: center; gap: var(--gap); text-align: center;
    z-index: 3;
  }
  h1 { font-size: var(--hs); line-height: 1.02; white-space: nowrap; }
  .dev {
    position: absolute; transform: translate(-50%, -50%) rotate(var(--r, 0deg));
    filter: drop-shadow(0 calc(var(--dw) * .05) calc(var(--dw) * .07) rgba(10, 5, 45, .55))
            drop-shadow(0 calc(var(--dw) * .012) calc(var(--dw) * .02) rgba(10, 5, 45, .3));
    width: var(--dw); z-index: 2;
  }
  .dev img { width: 100%; display: block; }
  .halo {
    position: absolute; transform: translate(-50%, -50%); aspect-ratio: 1; z-index: 1;
    background: radial-gradient(circle, rgba(150, 132, 255, .38), rgba(150, 132, 255, .12) 40%, transparent 66%);
  }
  .spark { position: absolute; z-index: 4; transform: translate(-50%, -50%); }

  /* Header: the headline fills the small safe area; the iPad and iPhone sit
     either side of it, inside the safe area's height. */
  body.header { --text-top: 150px; --gap: 36px; --hs: 150px; }
  body.header .label { font-size: 40px; }
  body.header #d1 { left: calc(50% - 1150px); top: 50%; --dw: 560px; --r: -6deg; }
  body.header #d2 { left: calc(50% + 1150px); top: 50%; --dw: 330px; --r: 6deg; }
  body.header #d3 { display: none; }
  body.header .halo { left: 50%; top: 50%; width: 2600px; }

  /* Search results: headline across the top of the safe area, the Mac with the
     iPad and iPhone in front of it below. */
  body.search { --text-top: 40px; --gap: 30px; --hs: 132px; }
  body.search .label { font-size: 40px; }
  body.search #d3 { left: 50%; top: calc(50% + 300px); --dw: 1240px; }
  body.search #d1 { left: calc(50% - 760px); top: calc(50% + 330px); --dw: 420px; --r: -4deg; z-index: 3; }
  body.search #d2 { left: calc(50% + 780px); top: calc(50% + 370px); --dw: 220px; --r: 4deg; z-index: 3; }
  body.search .halo { left: 50%; top: calc(50% + 200px); width: 2400px; }
</style>
</head>
<body class="$kind">
$pages
  <div class="halo"></div>
  <div class="dev" id="d1"><img src="$ipad_png"></div>
  <div class="dev" id="d2"><img src="$iphone_png"></div>
  <div class="dev" id="d3"><img src="$mac_png"></div>
  <div class="safe">
    <div class="text">
      <div class="label">$label</div>
      <h1>$headline</h1>
    </div>
  </div>
  <div class="guide" style="left: calc((var(--w) - var(--sw)) / 2); top: calc((var(--h) - var(--sh)) / 2); width: var(--sw); height: var(--sh);"></div>
  <div class="spark" id="s1"><svg viewBox="0 0 100 100"><path fill="#FFE2B8" d="M50 0 C54 34 66 46 100 50 C66 54 54 66 50 100 C46 66 34 54 0 50 C34 46 46 34 50 0Z"/></svg></div>
  <div class="spark" id="s2"><svg viewBox="0 0 100 100"><path fill="#FFE2B8" d="M50 0 C54 34 66 46 100 50 C66 54 54 66 50 100 C46 66 34 54 0 50 C34 46 46 34 50 0Z"/></svg></div>
<script>
if (location.search.includes("guides=1")) document.body.classList.add("guides");
document.fonts.ready.then(() => {
  // Shrink the one-line headline until it fits the safe area's width.
  const h1 = document.querySelector("h1");
  const safe = document.querySelector(".safe").getBoundingClientRect().width;
  let size = parseFloat(getComputedStyle(h1).fontSize);
  while (h1.scrollWidth > safe - 40 && size > 60) { size -= 4; h1.style.fontSize = size + "px"; }
  const em = document.querySelector("h1 em");
  const place = (el, dx, dy, d) => {
    if (!em) { el.remove(); return; }
    const rects = em.getClientRects();
    const r = rects[rects.length - 1];
    Object.assign(el.style, { left: (r.right + dx * size) + "px", top: (r.top + dy * size) + "px",
                              width: d * size + "px", height: d * size + "px",
                              filter: "drop-shadow(0 0 " + (size * .1) + "px rgba(255,216,163,.7))" });
  };
  place(document.getElementById("s1"), .2, .3, .36);
  place(document.getElementById("s2"), .5, .64, .17);
});
</script>
</body>
</html>
