<!doctype html>
<!-- App Store creative assets (product-page header, search results), filled
     in and rendered by bin/make-creative-assets.py ($placeholders are
     string.Template fields). The headline sits inside Apple's centered safe
     area ($safe_w x $safe_h); open with ?guides=1 to see it. Big iPhones run
     off the canvas edges, with trope chips floating around the headline. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="$css">
<style>
  :root { --w: ${w}px; --h: ${h}px; --sw: ${safe_w}px; --sh: ${safe_h}px; }
  .text { position: absolute; display: flex; flex-direction: column; z-index: 3; }
  .phone { --pw: 1050px; }
  .phone.back { filter: drop-shadow(0 50px 70px rgba(10, 5, 45, .6)) brightness(.97); }
  .label.bare::before, .label.bare::after { display: none; }
  .chip.small { font-size: 38px; padding: 20px 38px; }

  /* Header: a reader iPhone either side, cut by the canvas edge, and the
     headline centered between them. */
  body.header .text { left: 0; right: 0; top: 520px; align-items: center; gap: 44px; text-align: center; }
  body.header h1 { --hs: 176px; line-height: 1.04; }
  body.header .sub { --ss: 48px; margin-top: 4px; white-space: nowrap; }
  body.header #p1 { left: 545px; top: 1220px; --r: -8deg; }
  body.header #p2 { left: 3330px; top: 470px; --r: 8deg; }
  body.header #p3, body.header .bar { display: none; }

  /* Search results: the headline, copy and a search bar on the left; the
     search, reader and dark reader iPhones fanned out to the right edge. */
  body.search .text { left: 861px; top: 735px; align-items: flex-start; gap: 0; }
  body.search .label { font-size: 40px; }
  body.search h1 { --hs: 228px; line-height: 1.0; margin-top: 24px; }
  body.search .sub { --ss: 54px; width: 860px; margin-top: 44px; text-wrap: pretty; }
  body.search .phone { --pw: 990px; }
  body.search #p1 { left: 2475px; top: 1335px; --r: -2deg; z-index: 4; }
  body.search #p2 { left: 3195px; top: 1290px; --r: 4deg; z-index: 3; }
  body.search #p3 { left: 3800px; top: 1230px; --r: 9deg; z-index: 2; }

  .bar {
    margin-top: 54px; display: flex; align-items: center; gap: 22px;
    padding: 22px 48px 22px 36px; border-radius: 999px; width: fit-content;
    background: linear-gradient(180deg, rgba(255, 255, 255, .16), rgba(255, 255, 255, .07));
    border: 2px solid rgba(255, 255, 255, .26);
    box-shadow: 0 30px 60px rgba(12, 6, 50, .4), inset 0 1px 0 rgba(255, 255, 255, .25);
    font: 500 40px/1 "SFD", system-ui; color: #fff; white-space: nowrap;
  }
  .bar svg { width: 42px; height: 42px; flex: none; }
  .bar .tag { position: static; transform: none; padding: 14px 26px; font-size: 36px; box-shadow: none; }
  .bar .tag::after { content: " \00D7"; opacity: .6; }
  .bar .typed::after { content: ""; display: inline-block; width: 4px; height: 52px; margin-left: 8px;
                       vertical-align: -10px; background: rgba(255, 255, 255, .85); }
</style>
</head>
<body class="$kind">
$pages
$chips
  <div class="phone" id="p1"><img src="$phone1"></div>
  <div class="phone back" id="p2"><img src="$phone2"></div>
  <div class="phone back" id="p3"><img src="$phone3"></div>
  <div class="text">
    <div class="label $label_class">$label</div>
    <h1>$headline</h1>
    <div class="sub">$sub</div>
    <div class="bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <span class="chip warm tag">Slow Burn</span><span class="chip accent tag">Complete</span>
      <span class="typed">found fam</span>
    </div>
  </div>
  <div class="guide" style="left: calc((var(--w) - var(--sw)) / 2); top: calc((var(--h) - var(--sh)) / 2); width: var(--sw); height: var(--sh);"></div>
  <div class="spark" id="s1"><svg viewBox="0 0 100 100"><path fill="#FFE2B8" d="M50 0 C54 34 66 46 100 50 C66 54 54 66 50 100 C46 66 34 54 0 50 C34 46 46 34 50 0Z"/></svg></div>
  <div class="spark" id="s2"><svg viewBox="0 0 100 100"><path fill="#FFE2B8" d="M50 0 C54 34 66 46 100 50 C66 54 54 66 50 100 C46 66 34 54 0 50 C34 46 46 34 50 0Z"/></svg></div>
<script>
if (location.search.includes("guides=1")) document.body.classList.add("guides");
document.fonts.ready.then(() => {
  // Two sparkles off the gold accent's last line, sized to the headline.
  const em = document.querySelector("h1 em");
  const size = parseFloat(getComputedStyle(document.querySelector("h1")).fontSize);
  const place = (el, dx, dy, d) => {
    if (!em) { el.remove(); return; }
    const rects = em.getClientRects();
    const r = rects[rects.length - 1];
    Object.assign(el.style, { left: (r.right + dx * size) + "px", top: (r.top + dy * size) + "px",
                              width: d * size + "px", height: d * size + "px" });
  };
  place(document.getElementById("s1"), .2, .2, .24);
  place(document.getElementById("s2"), .32, .55, .12);
});
</script>
</body>
</html>
