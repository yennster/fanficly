org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Keystore credentials for release signing are injected here on the build
# machine (or via env vars) — never commit real values. See ANDROID_PUBLISHING.md.
# FANFICLY_STORE_FILE=/absolute/path/to/fanficly-release.keystore
# FANFICLY_STORE_PASSWORD=
# FANFICLY_KEY_ALIAS=fanficly
# FANFICLY_KEY_PASSWORD=
